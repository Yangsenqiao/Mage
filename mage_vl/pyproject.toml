[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mage-vl"
version = "0.2.0"
description = "Inference scripts for Mage-VL-Base"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "torch>=2.9",
    "torchvision>=0.24",
    "transformers>=5.7",
    "accelerate>=1.0",
    "safetensors>=0.4",
    "huggingface_hub>=0.20",
    "numpy>=1.26",
    "pillow>=10.0",
    "opencv-python>=4.8",
    "scipy>=1.11",
    "openai>=1.0",
    "decord>=0.6",
    "moviepy<2",
    "codec-video-prep>=0.2.5",
    "mamba-ssm>=2.2",
    "flash-attn>=2.7",
]

[project.optional-dependencies]
demo = ["gradio==6.29.1"]

[tool.setuptools]
py-modules = ["inference_base", "inference_streaming", "inference_live", "streaming_session", "demo_live"]
